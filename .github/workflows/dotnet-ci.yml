name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TrackMyDelivery.slnx

      - name: Build
        run: dotnet build TrackMyDelivery.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TrackMyDelivery.slnx --configuration Release --no-build --verbosity normal
